<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Northwind Cloud – Lead Qualifier</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f6fa;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.2rem; font-weight: 600; }
    header span { font-size: 0.8rem; opacity: 0.6; }

    .layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 24px;
    }

    /* ---- Form panel ---- */
    .panel {
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .panel h2 { font-size: 1rem; font-weight: 600; margin-bottom: 20px; }

    label { display: block; font-size: 0.82rem; font-weight: 500; margin-bottom: 4px; color: #555; }
    input, textarea {
      width: 100%;
      border: 1px solid #dde1ea;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color .15s;
    }
    input:focus, textarea:focus { border-color: #4f46e5; }
    textarea { resize: vertical; min-height: 120px; }

    .field { margin-bottom: 16px; }
    .char-counter { text-align: right; font-size: 0.75rem; color: #999; margin-top: 3px; }

    button#submit-btn {
      width: 100%;
      padding: 10px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .15s;
    }
    button#submit-btn:hover:not(:disabled) { background: #3730a3; }
    button#submit-btn:disabled { background: #a5b4fc; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-banner {
      background: #fef2f2; border: 1px solid #fca5a5;
      color: #991b1b; border-radius: 6px;
      padding: 10px 12px; margin-top: 14px;
      font-size: 0.85rem; display: none;
    }

    /* ---- Result panel ---- */
    #result-panel { display: none; }

    .score-badge {
      display: inline-block;
      font-size: 2rem; font-weight: 700;
      padding: 10px 18px;
      border-radius: 8px;
      margin-right: 12px;
    }
    .priority-high   { background: #dcfce7; color: #166534; }
    .priority-medium { background: #fef9c3; color: #854d0e; }
    .priority-low    { background: #f1f5f9; color: #475569; }

    .result-section { margin-top: 20px; }
    .result-section h3 { font-size: 0.85rem; text-transform: uppercase;
      letter-spacing: .05em; color: #6b7280; margin-bottom: 8px; }

    .product-card {
      border: 1px solid #e5e7eb; border-radius: 6px;
      padding: 10px 12px; margin-bottom: 8px;
    }
    .product-card .pname { font-weight: 600; font-size: 0.9rem; }
    .product-card .pscore {
      font-size: 0.75rem; color: #4f46e5; font-weight: 600;
      background: #eef2ff; padding: 2px 6px; border-radius: 4px; margin-left: 6px;
    }
    .product-card .pwhy { font-size: 0.85rem; color: #555; margin-top: 4px; }
    .low-confidence-note {
      font-size: 0.78rem; color: #d97706; background: #fffbeb;
      border: 1px solid #fcd34d; border-radius: 4px; padding: 6px 8px; margin-bottom: 8px;
    }

    ul.needs-list, ul.fq-list {
      padding-left: 18px; font-size: 0.9rem; color: #374151; line-height: 1.7;
    }
    .next-step {
      background: #f0fdf4; border-left: 3px solid #22c55e;
      padding: 10px 14px; border-radius: 0 6px 6px 0;
      font-size: 0.9rem;
    }

    /* ---- Leads table ---- */
    #leads-section { max-width: 1200px; margin: 0 auto 40px; padding: 0 24px; }
    #leads-section h2 { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; background: #fff;
      border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    th { background: #1a1a2e; color: #fff; text-align: left;
      padding: 10px 14px; font-size: 0.8rem; text-transform: uppercase; }
    td { padding: 10px 14px; font-size: 0.88rem; border-bottom: 1px solid #f1f5f9; }
    tr:last-child td { border-bottom: none; }
    tr.lead-row { cursor: pointer; transition: background .1s; }
    tr.lead-row:hover { background: #f0f4ff; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.78rem; font-weight: 600;
    }
    .badge-High   { background: #dcfce7; color: #166534; }
    .badge-Medium { background: #fef9c3; color: #854d0e; }
    .badge-Low    { background: #f1f5f9; color: #475569; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🚀 Northwind Cloud – Lead Qualifier</h1>
    <span>AI-powered B2B sales lead analysis</span>
  </div>
</header>

<div class="layout">
  <!-- LEFT: Form -->
  <div class="panel">
    <h2>Qualify a New Lead</h2>
    <form id="lead-form">
      <div class="field">
        <label for="company_name">Company Name</label>
        <input id="company_name" type="text" placeholder="Acme Corp" required minlength="2" maxlength="100" />
      </div>
      <div class="field">
        <label for="contact_email">Contact Email</label>
        <input id="contact_email" type="email" placeholder="jane@acme.com" required />
      </div>
      <div class="field">
        <label for="requirement_text">Requirement (20–2000 chars)</label>
        <textarea id="requirement_text" placeholder="Describe what the prospect is looking for…" required minlength="20" maxlength="2000"></textarea>
        <div class="char-counter"><span id="char-count">0</span> / 2000</div>
      </div>
      <button type="submit" id="submit-btn">
        <div class="spinner" id="spinner"></div>
        <span id="btn-label">Analyze Lead</span>
      </button>
      <div class="error-banner" id="error-banner"></div>
    </form>
  </div>

  <!-- RIGHT: Result -->
  <div class="panel" id="result-panel">
    <h2>Analysis Result</h2>
    <div id="result-content"></div>
  </div>
</div>

<!-- Recent Leads table -->
<div id="leads-section">
  <h2>Recent Leads</h2>
  <table id="leads-table">
    <thead>
      <tr>
        <th>#</th><th>Company</th><th>Email</th><th>Score</th>
        <th>Priority</th><th>Status</th><th>Submitted</th>
      </tr>
    </thead>
    <tbody id="leads-tbody">
      <tr><td colspan="7" style="color:#999;text-align:center">Loading…</td></tr>
    </tbody>
  </table>
</div>

<script>
  const API = '';  // same origin

  // -- Helpers --
  function priorityClass(p) {
    return p === 'High' ? 'priority-high' : p === 'Medium' ? 'priority-medium' : 'priority-low';
  }

  function fmt(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleString();
  }

  // -- Char counter --
  const reqTA = document.getElementById('requirement_text');
  const charCount = document.getElementById('char-count');
  reqTA.addEventListener('input', () => { charCount.textContent = reqTA.value.length; });

  // -- Load leads table --
  async function loadLeads() {
    try {
      const res = await fetch(`${API}/api/leads`);
      if (!res.ok) throw new Error('Failed to load leads');
      const leads = await res.json();
      renderLeadsTable(leads);
    } catch (e) {
      document.getElementById('leads-tbody').innerHTML =
        `<tr><td colspan="7" style="color:#dc2626">Error loading leads: ${e.message}</td></tr>`;
    }
  }

  function renderLeadsTable(leads) {
    const tbody = document.getElementById('leads-tbody');
    if (!leads.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="color:#999;text-align:center">No leads yet.</td></tr>';
      return;
    }
    tbody.innerHTML = leads.map(l => `
      <tr class="lead-row" data-id="${l.id}">
        <td>${l.id}</td>
        <td>${esc(l.company_name)}</td>
        <td>${esc(l.contact_email)}</td>
        <td><strong>${l.lead_score}</strong></td>
        <td><span class="badge badge-${l.priority}">${l.priority}</span></td>
        <td>${esc(l.status)}</td>
        <td>${fmt(l.created_at)}</td>
      </tr>`).join('');

    tbody.querySelectorAll('.lead-row').forEach(row => {
      row.addEventListener('click', () => loadAndShowLead(parseInt(row.dataset.id)));
    });
  }

  async function loadAndShowLead(id) {
    try {
      const res = await fetch(`${API}/api/leads/${id}`);
      if (!res.ok) throw new Error('Lead not found');
      const lead = await res.json();
      renderResult(lead);
    } catch (e) {
      alert(`Error loading lead: ${e.message}`);
    }
  }

  // -- Render result panel --
  function renderResult(lead) {
    const a = lead.ai_analysis;
    const ctx = lead.retrieved_context;
    const hasLowConf = ctx.some(c => c.low_confidence);

    // Build product cards – merge retrieved_context scores with relevant_products from LLM.
    // Fuzzy match: if the LLM appended a category "(Data Management)" to the name,
    // exact lookup fails. Fall back to checking if any retrieved name is contained
    // within the LLM name string.
    const scoreMap = {};
    ctx.forEach(c => { scoreMap[c.name] = c.relevance_score; });

    function findScore(llmName) {
      // 1. Exact match
      if (scoreMap[llmName] !== undefined) return scoreMap[llmName];
      // 2. Fuzzy: retrieved name is a substring of the LLM name
      for (const [key, val] of Object.entries(scoreMap)) {
        if (llmName.includes(key)) return val;
      }
      return undefined;
    }

    const productCards = (a.relevant_products || []).map(p => {
      const score = findScore(p.name);
      const scorePct = score !== undefined ? `${Math.round(score * 100)}%` : '';
      return `
        <div class="product-card">
          <div><span class="pname">${esc(p.name)}</span>${scorePct ? `<span class="pscore">${scorePct} match</span>` : ''}</div>
          <div class="pwhy">${esc(p.why)}</div>
        </div>`;
    }).join('');

    const needs = (a.customer_needs || []).map(n => `<li>${esc(n)}</li>`).join('');
    const fqs = (a.follow_up_questions || []).map(q => `<li>${esc(q)}</li>`).join('');

    document.getElementById('result-content').innerHTML = `
      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:12px">
        <div class="score-badge ${priorityClass(lead.priority)}">${lead.lead_score}</div>
        <div>
          <div style="font-weight:700;font-size:1.1rem">${esc(lead.company_name)}</div>
          <div style="font-size:0.85rem;color:#6b7280">${esc(lead.contact_email)}</div>
          <div style="margin-top:4px">
            <span class="badge badge-${lead.priority}">${lead.priority} Priority</span>
          </div>
        </div>
      </div>

      <div class="result-section" style="margin-top:14px">
        <div style="font-size:0.9rem;color:#374151;font-style:italic">${esc(a.score_rationale || '')}</div>
      </div>

      <div class="result-section">
        <h3>Summary</h3>
        <p style="font-size:0.9rem;color:#374151;line-height:1.6">${esc(a.lead_summary || '')}</p>
      </div>

      <div class="result-section">
        <h3>Matched Products</h3>
        ${hasLowConf ? '<div class="low-confidence-note">⚠ Low retrieval confidence – results may be loosely related.</div>' : ''}
        ${productCards}
      </div>

      <div class="result-section">
        <h3>Customer Needs</h3>
        <ul class="needs-list">${needs}</ul>
      </div>

      <div class="result-section">
        <h3>Recommended Next Step</h3>
        <div class="next-step">${esc(a.recommended_next_step || '')}</div>
      </div>

      <div class="result-section">
        <h3>Follow-Up Questions</h3>
        <ul class="fq-list">${fqs}</ul>
      </div>
    `;

    document.getElementById('result-panel').style.display = 'block';
    document.getElementById('result-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // -- Form submit --
  document.getElementById('lead-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const btn = document.getElementById('submit-btn');
    const spinner = document.getElementById('spinner');
    const label = document.getElementById('btn-label');
    const errBanner = document.getElementById('error-banner');

    btn.disabled = true;
    spinner.style.display = 'block';
    label.textContent = 'Analyzing…';
    errBanner.style.display = 'none';

    const body = {
      company_name: document.getElementById('company_name').value,
      contact_email: document.getElementById('contact_email').value,
      requirement_text: document.getElementById('requirement_text').value,
    };

    try {
      const res = await fetch(`${API}/api/leads`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      if (!res.ok) {
        const err = await res.json();
        const msg = err.detail
          ? (typeof err.detail === 'string' ? err.detail : JSON.stringify(err.detail))
          : `HTTP ${res.status}`;
        throw new Error(msg);
      }

      const lead = await res.json();
      renderResult(lead);
      await loadLeads();
    } catch (err) {
      errBanner.textContent = `Error: ${err.message}`;
      errBanner.style.display = 'block';
    } finally {
      btn.disabled = false;
      spinner.style.display = 'none';
      label.textContent = 'Analyze Lead';
    }
  });

  // -- Escape HTML to prevent XSS --
  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // -- Bootstrap --
  loadLeads();
</script>
</body>
</html>
